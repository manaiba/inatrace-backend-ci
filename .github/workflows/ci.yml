# Phase 1 (pull request) and phase 2 (merge to main). See RELEASE.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to a pull request supersedes its running checks. Runs on main are never
# cancelled, so every merged commit gets its image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Explicit bash runs steps with -eo pipefail (the implicit default has no pipefail).
defaults:
  run:
    shell: bash

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  image:
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/_image.yml
    with:
      push: ${{ github.event_name == 'push' }}
